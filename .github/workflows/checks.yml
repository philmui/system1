name: Offline application checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_MODE: test-fixture
      LANGSMITH_TRACING: 'false'
      UV_CACHE_DIR: /tmp/doc-discovery-uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
          python-version: '3.14.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/check_docs.py && uv run python scripts/verify_artifacts.py
      - run: npm ci --prefix frontend
      - run: npm run generate:types --prefix frontend && git diff --exit-code -- frontend/src/lib/api.schema.json frontend/src/lib/api.generated.ts
      - run: npm run lint --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm test --prefix frontend
