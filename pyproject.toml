[project]
name = "doc-discovery"
version = "0.1.0"
description = "Document Discovery Studio: inspectable Jev and LangGraph workflows"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langsmith==0.14.1",
    "openai==3.19.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pypdf==6.19.0",
    "python-multipart==0.0.32",
    "typesafe-sdk==0.7.2",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
doc-discovery = "doc_discovery.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]
