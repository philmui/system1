<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">A proposed service workflow for a mixed billing and outage request</title>
  <desc id="description">An illustrative customer message asks for an invoice explanation and reports an outage. koa-action supplies a proposed mixed-intent classification. Agent Graph retains both tasks and asks the customer which to handle first; the customer chooses billing in this example. AgentScript defines allowed handling paths. The billing backend verifies account context and enforces access before supplying information for the invoice explanation. Workflow state records billing as active and then explained, while the outage remains pending for subsequent handling. An unclear classification leads to clarification. No API syntax or measured result is implied.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#6A7E86"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #263B44; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; fill: #5A6D75; }
      .heading { font-size: 33px; font-weight: 650; letter-spacing: -.7px; }
      .subtitle { font-size: 18px; fill: #52666F; }
      .title { font-size: 22px; font-weight: 650; letter-spacing: -.3px; }
      .body { font-size: 16px; fill: #405863; }
      .small { font-size: 14px; fill: #536A74; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1px; fill: #47626C; }
      .connector { fill: none; stroke: #6A7E86; stroke-width: 2; marker-end: url(#arrow); }
      .card { stroke-width: 1.25; }
    </style>
  </defs>

  <rect width="1200" height="440" fill="#FBFCFD"/>
  <text x="50" y="38" class="eyebrow">ILLUSTRATIVE EXECUTION PATH</text>
  <text x="50" y="79" class="heading">A mixed request, with both tasks retained</text>
  <text x="50" y="111" class="subtitle">The model proposes a route; authored controls govern the next step.</text>

  <rect x="50" y="141" width="245" height="158" rx="18" fill="#EAF2FA" stroke="#D1DFEC" class="card"/>
  <text x="72" y="177" class="title">Customer request</text>
  <text x="72" y="211" class="body">“Explain this invoice.</text>
  <text x="72" y="235" class="body">Our service is also down.”</text>
  <text x="72" y="276" class="small">Two tasks in one message</text>

  <path d="M 303 220 H 327" class="connector"/>

  <rect x="335" y="141" width="245" height="158" rx="18" fill="#FFF4DD" stroke="#EBDDBB" class="card"/>
  <text x="357" y="177" class="title">koa-action</text>
  <text x="357" y="211" class="body">Proposes a mixed intent:</text>
  <text x="357" y="235" class="body">billing + outage</text>
  <text x="357" y="276" class="small">A bounded model judgment</text>

  <path d="M 588 220 H 612" class="connector"/>

  <rect x="620" y="141" width="245" height="158" rx="18" fill="#F0EDF9" stroke="#DDD7EC" class="card"/>
  <text x="642" y="177" class="title">Agent Graph</text>
  <text x="642" y="211" class="body">Ask which task comes first</text>
  <text x="642" y="235" class="body">Customer chooses billing</text>
  <text x="642" y="276" class="small">AgentScript defines paths</text>

  <path d="M 873 220 H 897" class="connector"/>

  <rect x="905" y="141" width="245" height="158" rx="18" fill="#E9F4EF" stroke="#CBDED4" class="card"/>
  <text x="927" y="177" class="title">Billing path</text>
  <text x="927" y="211" class="body">Backend verifies caller</text>
  <text x="927" y="235" class="body">and enforces account access</text>
  <text x="927" y="276" class="small">Then explain the invoice</text>

  <path d="M 742 299 V 322" class="connector"/>
  <rect x="50" y="330" width="1100" height="61" rx="14" fill="#F3F6F8" stroke="#DCE5E9" stroke-width="1.25"/>
  <text x="72" y="365" class="label">WORKFLOW STATE</text>
  <path d="M 258 344 V 377" stroke="#D3DFE5" stroke-width="1.25"/>
  <text x="284" y="366" class="body">Billing: active → explained</text>
  <path d="M 656 344 V 377" stroke="#D3DFE5" stroke-width="1.25"/>
  <text x="682" y="366" class="body">Outage: pending → resume next</text>

  <text x="50" y="424" class="small">If the intent is unclear, ask for clarification before choosing a handling path.</text>
</svg>
