<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="865" viewBox="0 0 1220 865" role="img" aria-labelledby="title desc">
<title id="title">Commands, events, review and replay</title>
<desc id="desc">The browser starts a run and receives its ID. The backend executes a checkpointed graph and persists events before streaming them. Human review resumes the same thread. Reconnection loads a consistent snapshot and resumes from its cursor; replay reads local events only.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617082"/></marker></defs>
<style>text {font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#213047} .title {font-size:26px;font-weight:650} .subtitle {font-size:15px;fill:#5d6878} .label {font-size:15px;font-weight:600} .body {font-size:13px;fill:#46546a} .edge-label {font-size:12px;fill:#4b596d} .lane {font-size:14px;font-weight:600}</style>
<rect width="1220" height="865" rx="16" fill="#fff"/>
<text class="title" x="32" y="42">Commands, events, review and replay</text>
<text class="subtitle" x="32" y="68">Execution continues independently of the browser connection.</text>
<path d="M125,165 V790" fill="none" stroke="#cad3df" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M415,165 V790" fill="none" stroke="#cad3df" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M717,165 V790" fill="none" stroke="#cad3df" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M1045,165 V790" fill="none" stroke="#cad3df" stroke-width="2" stroke-dasharray="5 5"/>
<polyline points="125,210 415,210" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="140.75" y="185" width="252.5" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="267" y="198">POST classification + idempotency key</text>
<polyline points="415,253 125,253" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="228.5" y="229" width="77.0" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="267" y="242">202 Run ID</text>
<polyline points="415,295 717,295" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="475.5" y="271" width="181.0" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="566" y="284">Schedule bounded async job</text>
<polyline points="717,337 1045,337" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="760.25" y="313" width="239.5" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="880" y="326">Persist event and allocate sequence</text>
<polyline points="1045,380 415,380 125,380" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="217.0" y="355" width="246.0" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="340" y="368">SSE execution event with sequence ID</text>
<polyline points="717,432 1045,432" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="763.5" y="407" width="233.0" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="880" y="420">Checkpoint review; persist request</text>
<polyline points="1045,475 125,475" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="309.5" y="450" width="259.0" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="439" y="463">Review items + interrupt ID + revision</text>
<polyline points="125,520 415,520" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="179.75" y="495" width="174.5" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="267" y="508">POST all review decisions</text>
<polyline points="415,565 717,565" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="465.75" y="540" width="200.5" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="566" y="553">Validate; Command(resume=...)</text>
<polyline points="717,610 1045,610" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="776.5" y="585" width="207.0" height="18" rx="4" fill="#fff"/>
