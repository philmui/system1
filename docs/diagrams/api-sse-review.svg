<polyline points="1045,654 125,654" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="347.75" y="629" width="174.5" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="435" y="642">Terminal event; close SSE</text>
<polyline points="125,710 415,710" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="137.5" y="684" width="259.0" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="267" y="697">Reload: GET snapshot; SSE after cursor</text>
<polyline points="415,753 125,753" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="150.5" y="728" width="233.0" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="267" y="741">Consistent snapshot + later events</text>
<rect x="25" y="105" width="200" height="60" rx="11" fill="#edf4ff" stroke="#2563a0" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="125.0" y="133">Browser</text>
<rect x="315" y="105" width="200" height="60" rx="11" fill="#edf4ff" stroke="#2563a0" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="415.0" y="133">FastAPI</text>
<rect x="605" y="105" width="225" height="60" rx="11" fill="#e9f7f1" stroke="#20725c" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="717.5" y="133">Graph + checkpoint</text>
<rect x="920" y="105" width="250" height="60" rx="11" fill="#f2f4f7" stroke="#5d6878" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="1045.0" y="133">Local event log</text>
<text class="body" x="25" y="830">Replay and scrubbing fold the stored event sequence in the browser. They do not invoke providers or change recorded timing.</text>
</svg>
