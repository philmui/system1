<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="685" viewBox="0 0 1200 685" role="img" aria-labelledby="title desc">
<title id="title">One node definition, several runtime workers</title>
<desc id="desc">A three-document batch schedules three instances of one compiled worker. Results are keyed by document ID. The join requires exact equality between expected and terminal outcome ID sets; a failed worker still supplies an outcome.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617082"/></marker></defs>
<style>text {font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#213047} .title {font-size:26px;font-weight:650} .subtitle {font-size:15px;fill:#5d6878} .label {font-size:15px;font-weight:600} .body {font-size:13px;fill:#46546a} .edge-label {font-size:12px;fill:#4b596d} .lane {font-size:14px;font-weight:600}</style>
<rect width="1200" height="685" rx="16" fill="#fff"/>
<text class="title" x="32" y="42">One node definition, several runtime workers</text>
<text class="subtitle" x="32" y="68">The input determines the worker count. Completion order cannot overwrite another result.</text>
<rect x="325" y="95" width="300" height="445" rx="16" fill="#fafbfd" stroke="#d3dbe6" stroke-dasharray="6 5"/>
<text class="lane" x="343" y="120">Compiled worker instances</text>
<polyline points="255,283 300,283 300,170 355,170" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="255,298 355,315" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="255,313 300,313 300,460 355,460" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="595,170 645,170 645,278 700,278" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="613.75" y="210" width="70.5" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="649" y="223">A outcome</text>
<polyline points="595,315 700,300" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="611.75" y="283" width="70.5" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="647" y="296">B outcome</text>
<polyline points="595,460 645,460 645,328 700,328" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="613.75" y="385" width="70.5" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="649" y="398">C outcome</text>
<polyline points="945,297 995,297" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="250" width="215" height="95" rx="11" fill="#edf4ff" stroke="#2563a0" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="147.5" y="278">Batch dispatch</text>
<text class="body" text-anchor="middle" x="147.5" y="300">Expected IDs: A, B, C</text>
<text class="body" text-anchor="middle" x="147.5" y="319">LangGraph Send</text>
<rect x="355" y="130" width="240" height="80" rx="11" fill="#e9f7f1" stroke="#20725c" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="475.0" y="158">worker:A</text>
<text class="body" text-anchor="middle" x="475.0" y="180">Invoice · accepted</text>
<rect x="355" y="275" width="240" height="80" rx="11" fill="#fff4db" stroke="#906419" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="475.0" y="303">worker:B</text>
<text class="body" text-anchor="middle" x="475.0" y="325">Mixed email · review</text>
<rect x="355" y="420" width="240" height="80" rx="11" fill="#fff0ef" stroke="#aa4a46" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="475.0" y="448">worker:C</text>
<text class="body" text-anchor="middle" x="475.0" y="470">Empty file · issue</text>
<rect x="700" y="250" width="245" height="95" rx="11" fill="#f2f4f7" stroke="#5d6878" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="822.5" y="278">Deterministic reducer</text>
<text class="body" text-anchor="middle" x="822.5" y="300">outcomes[A], [B], [C]</text>
<text class="body" text-anchor="middle" x="822.5" y="319">Merge by stable identity</text>
<rect x="995" y="250" width="175" height="95" rx="11" fill="#edf4ff" stroke="#2563a0" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="1082.5" y="278">Join: 3 / 3</text>
<text class="body" text-anchor="middle" x="1082.5" y="300">All terminal IDs</text>
<text class="body" text-anchor="middle" x="1082.5" y="319">Continue parent</text>
<text class="body" x="40" y="595">Concurrency is bounded to four by default. Stable positions identify workers even when they finish in a different order.</text>
<text class="body" x="40" y="616">A review proposal is a terminal worker outcome. Human review pauses the parent after aggregation.</text>
</svg>
