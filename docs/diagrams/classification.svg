<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="870" viewBox="0 0 1320 870" role="img" aria-labelledby="title desc">
<title id="title">Follow one document through classification</title>
<desc id="desc">Documents fan out into compiled workers. Readable text receives a Jev category decision. Accepted categories bypass OpenAI. Ambiguous decisions get a proposal requiring review. Every handled path returns a keyed outcome; the parent joins and indexes accepted readable documents.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617082"/></marker></defs>
<style>text {font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#213047} .title {font-size:26px;font-weight:650} .subtitle {font-size:15px;fill:#5d6878} .label {font-size:15px;font-weight:600} .body {font-size:13px;fill:#46546a} .edge-label {font-size:12px;fill:#4b596d} .lane {font-size:14px;font-weight:600}</style>
<rect width="1320" height="870" rx="16" fill="#fff"/>
<text class="title" x="32" y="42">Follow one document through classification</text>
<text class="subtitle" x="32" y="68">A parent graph collects every worker outcome before one review pause.</text>
<rect x="290" y="88" width="995" height="590" rx="16" fill="#fafbfd" stroke="#d3dbe6" stroke-dasharray="6 5"/>
<text class="lane" x="308" y="113">One compiled document worker; failures also produce a terminal outcome</text>
<polyline points="250,158 315,158" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="263.0" y="135" width="38.0" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="282" y="148">Send</text>
<polyline points="423,195 423,265" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="530,300 615,300" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="556.25" y="277" width="31.5" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="572" y="290">yes</text>
<polyline points="855,307 920,307" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="423,340 423,420" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="410.5" y="370" width="25.0" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="423" y="383">no</text>
<polyline points="1040,265 1040,195" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1014.5" y="217" width="51.0" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="1040" y="230">accept</text>
<polyline points="1040,350 1040,420" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1004.75" y="380" width="70.5" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="1040" y="393">ambiguous</text>
<polyline points="1160,158 1240,158 1240,617 860,617" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1040,505 1040,550 810,550 810,580" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="423,495 423,540 675,540 675,580" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="610,617 275,617" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="157,655 157,730" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="121.75" y="687" width="70.5" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="157" y="700">proposals</text>
<polyline points="275,767 385,767" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="304.5" y="743" width="51.0" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="330" y="756">resume</text>
<polyline points="275,635 510,635 510,730" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="369.0" y="667" width="90.0" height="18" rx="4" fill="#fff"/>
<text class="edge-label" text-anchor="middle" x="414" y="680">no proposals</text>
<polyline points="630,767 745,767" fill="none" stroke="#617082" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="120" width="210" height="75" rx="11" fill="#edf4ff" stroke="#2563a0" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="145.0" y="148">Validate and dispatch</text>
<text class="body" text-anchor="middle" x="145.0" y="170">One worker per document</text>
<rect x="315" y="120" width="215" height="75" rx="11" fill="#f2f4f7" stroke="#5d6878" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="422.5" y="148">Read extraction + anchors</text>
<text class="body" text-anchor="middle" x="422.5" y="170">Validated during ingestion</text>
<rect x="315" y="265" width="215" height="75" rx="11" fill="#f2f4f7" stroke="#5d6878" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="422.5" y="293">Readable content?</text>
<text class="body" text-anchor="middle" x="422.5" y="315">Extraction status</text>
<rect x="615" y="265" width="240" height="85" rx="11" fill="#f4efff" stroke="#76539a" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="735.0" y="293">Jev category judgment</text>
<text class="body" text-anchor="middle" x="735.0" y="315">Choice + distribution</text>
<text class="body" text-anchor="middle" x="735.0" y="334">Record rubric and input</text>
<rect x="920" y="265" width="240" height="85" rx="11" fill="#e9f7f1" stroke="#20725c" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="1040.0" y="293">Apply policy</text>
<text class="body" text-anchor="middle" x="1040.0" y="315">Confidence, tie, unknown</text>
<text class="body" text-anchor="middle" x="1040.0" y="334">Rules in policies.py</text>
<rect x="315" y="420" width="215" height="75" rx="11" fill="#fff0ef" stroke="#aa4a46" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="422.5" y="448">Extraction issue</text>
<text class="body" text-anchor="middle" x="422.5" y="470">Unreadable, empty, scanned</text>
<rect x="920" y="120" width="240" height="75" rx="11" fill="#e9f7f1" stroke="#20725c" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="1040.0" y="148">Accept category</text>
<text class="body" text-anchor="middle" x="1040.0" y="170">Valid label and threshold</text>
<rect x="920" y="420" width="240" height="85" rx="11" fill="#f4efff" stroke="#76539a" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="1040.0" y="448">OpenAI proposal</text>
<text class="body" text-anchor="middle" x="1040.0" y="470">Bounded interpretation</text>
<text class="body" text-anchor="middle" x="1040.0" y="489">Always requires review</text>
<rect x="610" y="580" width="250" height="75" rx="11" fill="#f2f4f7" stroke="#5d6878" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="735.0" y="608">Return keyed outcome</text>
<text class="body" text-anchor="middle" x="735.0" y="630">Success, proposal or error</text>
<rect x="40" y="580" width="235" height="75" rx="11" fill="#edf4ff" stroke="#2563a0" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="157.5" y="608">Join every worker</text>
<text class="body" text-anchor="middle" x="157.5" y="630">Expected IDs = outcome IDs</text>
<rect x="40" y="730" width="235" height="75" rx="11" fill="#fff4db" stroke="#906419" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="157.5" y="758">Parent review interrupt</text>
<text class="body" text-anchor="middle" x="157.5" y="780">Review all proposals together</text>
<rect x="385" y="730" width="245" height="75" rx="11" fill="#e9f7f1" stroke="#20725c" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="507.5" y="758">Index accepted documents</text>
<text class="body" text-anchor="middle" x="507.5" y="780">Idempotent writes</text>
<rect x="745" y="730" width="230" height="75" rx="11" fill="#edf4ff" stroke="#2563a0" stroke-width="1.4"/>
<text class="label" text-anchor="middle" x="860.0" y="758">Publish batch result</text>
<text class="body" text-anchor="middle" x="860.0" y="780">Retain original + correction</text>
</svg>
